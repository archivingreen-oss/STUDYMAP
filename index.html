<title>변시 한눈에 맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#f6f3ec; --card:#fffefb; --ink:#2c2a26; --muted:#76726a; --faint:#9b968c;
    --line:#e6e1d6; --chip:#f0ece2; --chipink:#5b574e;
    --hot:#a8431f; --hotbg:#f7e7df; --weak:#8a5a0c; --weakbg:#f6ecd6; --done:#2f7d5c; --donebg:#e2f0e6;
    --accent:#0f6e56; --accent-bg:#e4f1ea; --accent-line:#bfe0d1; --accent-dark:#0a5040;
    --shadow:0 1px 2px rgba(50,45,35,.05),0 6px 18px rgba(50,45,35,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"IBM Plex Sans KR",sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

  header.top{padding:34px 0 18px}
  .brand{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  h1{font-family:"Hahmlet",serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
  h1 .sub{display:block;font-family:"IBM Plex Sans KR";font-weight:300;font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:0}
  .dday{font-family:"Hahmlet",serif;text-align:right;line-height:1.15}
  .dday .num{font-size:30px;font-weight:600;color:var(--hot)}
  .dday .lab{font-family:"IBM Plex Sans KR";font-size:12px;color:var(--muted);font-weight:300}

  .toolbar{position:sticky;top:0;z-index:30;background:rgba(246,243,236,.92);backdrop-filter:blur(8px);
    padding:12px 0;margin-bottom:6px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;font-family:inherit;font-size:14px;padding:9px 13px 9px 34px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--faint)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint)}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--chipink);cursor:pointer;transition:.15s}
  .filters button:hover{border-color:var(--faint)}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filters button .dot{font-weight:500}

  .sync{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);font-weight:300;width:100%}
  .sync .pip{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .sync.on .pip{background:var(--done)} .sync.off .pip{background:var(--weak)} .sync.local .pip{background:var(--faint)}
  .sync button{font-family:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--chipink);cursor:pointer;margin-left:auto}
  .sync button:hover{border-color:var(--faint)}

  .legend{font-size:12.5px;color:var(--muted);margin:14px 0 16px;font-weight:300}
  .legend b{font-weight:500;color:var(--chipink)}

  /* 과목 탭 */
  .subjtabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 18px;margin-bottom:2px}
  .subjtabs::-webkit-scrollbar{height:0}
  .subjtabs button{font-family:inherit;font-size:13.5px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--chipink);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s;flex:none}
  .subjtabs button:hover{border-color:var(--faint)}
  .subjtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .subjtabs .bdg{font-size:11px;opacity:.55;font-weight:500}
  .subjtabs button.on .bdg{opacity:.9}

  .subj-head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;margin-bottom:14px;
    background:var(--accent-bg);border:1px solid var(--accent-line)}
  .subj-head .nm{font-family:"Hahmlet",serif;font-weight:600;font-size:19px;color:var(--accent-dark)}
  .subj-head .desc{font-size:12px;color:var(--accent-dark);opacity:.7;font-weight:300}
  .subj-head .tally{margin-left:auto;display:flex;gap:12px;font-size:12.5px;color:var(--accent-dark);opacity:.85}
  .subj-head .tally b{font-weight:500}

  .part-label{font-family:"Hahmlet",serif;font-size:14px;color:var(--accent);font-weight:500;
    margin:18px 0 10px;padding-left:2px;display:flex;align-items:center;gap:9px}
  .part-label::before{content:"";width:16px;height:2px;background:var(--accent);border-radius:2px}
  .part-label:first-of-type{margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px 16px;box-shadow:var(--shadow)}
  .card-title{font-size:15px;font-weight:500;margin-bottom:11px;display:flex;align-items:center;gap:7px;color:var(--ink)}
  .card-title .ct-tag{font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:13px;font-weight:300;padding:5px 11px;border-radius:9px;background:var(--chip);color:var(--chipink);
    cursor:pointer;border:1px solid transparent;transition:.13s;user-select:none;white-space:nowrap}
  .chip:hover{filter:brightness(.97);transform:translateY(-1px)}
  .chip .tg{font-weight:500;margin-left:4px}
  .chip[data-status="hot"]{background:var(--hotbg);color:var(--hot);border-color:#eccdbf}
  .chip[data-status="weak"]{background:var(--weakbg);color:var(--weak);border-color:#ead9b3}
  .chip[data-status="done"]{background:var(--donebg);color:var(--done);border-color:#bfded0}
  .chip.hide,.card.hide,.part-label.hide{display:none}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);font-weight:300;line-height:1.7}
  @media(max-width:560px){h1{font-size:24px}.dday .num{font-size:24px}.grid{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>변시 한눈에 맵<span class="sub">제16회 변호사시험 · 과목별 학습 지도</span></h1>
      <div class="dday"><span class="num" id="dnum">D-…</span><span class="lab">제16회 변시 · 2027.1.12</span></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>

    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="on">전체</button>
      <button data-f="hot"><span class="dot" style="color:var(--hot)">◎</span> 빈출</button>
      <button data-f="weak"><span class="dot" style="color:var(--weak)">★</span> 약점</button>
      <button data-f="done"><span class="dot" style="color:var(--done)">✓</span> 완료</button>
      <button data-f="none">미분류</button>
    </div>
    <div class="sync local" id="sync"><span class="pip"></span><span id="syncMsg">로컬 저장 (이 브라우저)</span><button id="syncBtn" hidden></button></div>
  </div>

  <p class="legend">칩을 누르면 <b>◎ 빈출 → ★ 약점 → ✓ 완료 → 없음</b> 순서로 바뀝니다. 탭 옆 숫자는 <b>완료/전체</b> 쟁점 수입니다.</p>

  <nav class="subjtabs" id="subjtabs"></nav>

  <main>
    <div class="subj-head"><span class="nm"></span><span class="desc"></span><span class="tally" id="tally"></span></div>
    <div id="map"></div>
  </main>

  <footer>
    유정 님의 변시 준비용 학습 지도 · 설정 전에는 이 브라우저에만 저장됩니다.
  </footer>
</div>

// ---- 로컬 저장 + 마이그레이션(구버전 민법키 c|gi|ci|chi → c|civ|gi|ci|chi) ----
let store = {};
try{ store = JSON.parse(localStorage.getItem('minbeop_map')||'{}'); }catch(e){ store = {}; }
function migrate(obj){
  let changed=false;
  for(const k of Object.keys(obj)){
    if(/^c\|\d+\|\d+\|\d+$/.test(k)){
      const nk = 'c|civ|' + k.slice(2);
      if(!(nk in obj)) obj[nk] = obj[k];
      delete obj[k]; changed=true;
    }
  }
  return changed;
}
function saveLocal(){ try{ localStorage.setItem('minbeop_map', JSON.stringify(store)); }catch(e){} }
migrate(store); saveLocal();

const defaults = {};
function norm(ch){ return (typeof ch==='string') ? [ch,''] : ch; }
function eff(id){ return (id in store) ? store[id] : (defaults[id]||''); }

// 전 과목 default 미리 수집 (탭 진행도용)
SUBJECTS.forEach(s=>s.groups.forEach((g,gi)=>g.cards.forEach((card,ci)=>card.c.forEach((raw,chi)=>{
  const [,def]=norm(raw); if(def) defaults['c|'+s.key+'|'+gi+'|'+ci+'|'+chi]=def;
}))));

// ---- 과목 탭 ----
const map = document.getElementById('map');
const tabsEl = document.getElementById('subjtabs');
const startKey = localStorage.getItem('vsmap_subj') || 'civ';
let currentSubj = SUBJECTS.find(s=>s.key===startKey) || SUBJECTS[0];

function subjStats(s){
  let done=0,total=0;
  s.groups.forEach((g,gi)=>g.cards.forEach((card,ci)=>card.c.forEach((raw,chi)=>{
    const st=eff('c|'+s.key+'|'+gi+'|'+ci+'|'+chi); total++; if(st==='done') done++;
  })));
  return {done,total};
}
function renderTabs(){
  tabsEl.innerHTML='';
  SUBJECTS.forEach(s=>{
    const b=document.createElement('button');
    b.dataset.key=s.key;
    b.innerHTML=s.name+' <span class="bdg"></span>';
    if(s.key===currentSubj.key) b.classList.add('on');
    b.addEventListener('click',()=>switchSubject(s));
    tabsEl.appendChild(b);
  });
  updateTabBadges();
}
function updateTabBadges(){
  document.querySelectorAll('#subjtabs button').forEach(b=>{
    const s=SUBJECTS.find(x=>x.key===b.dataset.key);
    const {done,total}=subjStats(s);
    b.querySelector('.bdg').textContent=done+'/'+total;
  });
}
function switchSubject(s){
  currentSubj=s;
  localStorage.setItem('vsmap_subj', s.key);
  document.querySelectorAll('#subjtabs button').forEach(x=>x.classList.toggle('on', x.dataset.key===s.key));
  buildSubject(s);
}

// ---- 렌더 ----
function buildSubject(subj){
  map.innerHTML='';
  subj.groups.forEach((g, gi)=>{
    const pl=document.createElement('div'); pl.className='part-label'; pl.textContent=g.part;
    map.appendChild(pl);
    const grid=document.createElement('div'); grid.className='grid';
    g.cards.forEach((card, ci)=>{
      const el=document.createElement('div'); el.className='card';
      const title=document.createElement('div'); title.className='card-title';
      title.innerHTML = card.t + (card.tag?' <span class="ct-tag" style="color:var(--'+card.tag+')">'+SYM[card.tag]+'</span>':'');
      el.appendChild(title);
      const chips=document.createElement('div'); chips.className='chips';
      card.c.forEach((raw, chi)=>{
        const [txt, def]=norm(raw);
        const id='c|'+subj.key+'|'+gi+'|'+ci+'|'+chi;
        if(def) defaults[id]=def;
        const st=eff(id);
        const chip=document.createElement('span');
        chip.className='chip'; chip.dataset.id=id; chip.dataset.text=txt;
        if(st) chip.dataset.status=st;
        chip.innerHTML = txt + (st?'<span class="tg">'+SYM[st]+'</span>':'');
        chip.addEventListener('click', ()=>cycle(chip));
        chips.appendChild(chip);
      });
      el.appendChild(chips);
      grid.appendChild(el);
    });
    map.appendChild(grid);
  });
  document.querySelector('.subj-head .nm').textContent=subj.name;
  document.querySelector('.subj-head .desc').textContent=subj.sub;
  updateTally(); apply();
}

function cycle(chip){
  const cur=chip.dataset.status||'';
  const next=S[(S.indexOf(cur)+1)%S.length];
  if(next){ chip.dataset.status=next; } else { delete chip.dataset.status; }
  store[chip.dataset.id]=next;
  chip.innerHTML=chip.dataset.text+(next?'<span class="tg">'+SYM[next]+'</span>':'');
  saveLocal(); updateTally(); updateTabBadges(); cloudSave();
}

function updateTally(){
  const t={hot:0,weak:0,done:0};
  document.querySelectorAll('#map .chip').forEach(c=>{ const s=c.dataset.status; if(s)t[s]++; });
  document.getElementById('tally').innerHTML =
    '<span style="color:var(--hot)">◎ <b>'+t.hot+'</b></span>'+
    '<span style="color:var(--weak)">★ <b>'+t.weak+'</b></span>'+
    '<span style="color:var(--done)">✓ <b>'+t.done+'</b></span>';
}

// ---- 검색 + 필터 ----
let activeFilter='all', query='';
document.getElementById('filters').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); activeFilter=b.dataset.f; apply();
});
document.getElementById('q').addEventListener('input', e=>{ query=e.target.value.trim().toLowerCase(); apply(); });

function apply(){
  document.querySelectorAll('#map .grid').forEach(grid=>{
    grid.querySelectorAll('.card').forEach(card=>{
      const title=card.querySelector('.card-title').textContent.toLowerCase();
      let cardVisible=false;
      card.querySelectorAll('.chip').forEach(chip=>{
        const st=chip.dataset.status||'';
        const okF = activeFilter==='all' ? true : (activeFilter==='none' ? st==='' : st===activeFilter);
        const okQ = !query || chip.dataset.text.toLowerCase().includes(query) || title.includes(query);
        const show=okF&&okQ;
        chip.classList.toggle('hide', !show);
        if(show) cardVisible=true;
      });
      card.classList.toggle('hide', !cardVisible);
    });
  });
  document.querySelectorAll('#map .part-label').forEach(pl=>{
    let nx=pl.nextElementSibling, any=false;
    if(nx && nx.classList.contains('grid')) any=[...nx.querySelectorAll('.card')].some(c=>!c.classList.contains('hide'));
    pl.classList.toggle('hide', !any);
  });
}

  const exam=new Date(2027,0,12);
  const now=new Date(); const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d=Math.round((exam-t)/86400000);
  document.getElementById('dnum').textContent = d>0?('D-'+d):(d===0?'D-DAY':'D+'+(-d));

// ---- 초기 렌더 ----
renderTabs();
buildSubject(currentSubj);

// ---- Firebase 동기화 ----
let cloudUser=null, cloudRef=null, cloudSet=null, saveTimer=null;
function setSync(state, msg){
  const el=document.getElementById('sync');
  el.className='sync '+state;
  document.getElementById('syncMsg').textContent=msg;
}
function cloudSave(){
  if(!cloudUser||!cloudRef||!cloudSet) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await cloudSet(cloudRef,{vsmap:store,updated:Date.now()},{merge:true}); setSync('on','동기화됨 · '+(cloudUser.email||'')); }
    catch(e){ setSync('on','동기화 실패 (재시도됨)'); }
  },700);
}

async function initFirebase(){
  if(firebaseConfig.apiKey.includes('여기에')){ setSync('local','로컬 저장 (이 브라우저)'); return; }
  let appMod, authMod, fsMod;
  try{
    appMod  = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    authMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    fsMod   = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  }catch(e){ setSync('local','오프라인 · 로컬 저장'); return; }

  const app=appMod.initializeApp(firebaseConfig);
  const auth=authMod.getAuth(app);
  const db=fsMod.getFirestore(app);
  const provider=new authMod.GoogleAuthProvider();
  try{ await authMod.setPersistence(auth, authMod.browserLocalPersistence); }catch(e){}

  const btn=document.getElementById('syncBtn');
  btn.hidden=false; btn.textContent='Google 로그인';
  btn.onclick=()=>{
    if(cloudUser){ authMod.signOut(auth); }
    else{ authMod.signInWithPopup(auth, provider).catch(()=>setSync('off','로그인 취소/실패 · 다시 시도')); }
  };

  authMod.onAuthStateChanged(auth, async user=>{
    if(user){
      cloudUser=user; btn.textContent='로그아웃';
      setSync('on','동기화 중 · '+(user.email||user.displayName||'로그인됨'));
      try{
        cloudRef=fsMod.doc(db,'users',user.uid); cloudSet=fsMod.setDoc;
        const snap=await fsMod.getDoc(cloudRef);
        const remote=(snap.exists() && snap.data().vsmap)||{};
        store=Object.assign({}, store, remote);   // 클라우드 값 우선 병합
        migrate(store);                            // 클라우드의 구버전 민법키도 변환
        saveLocal(); buildSubject(currentSubj); updateTabBadges();
        cloudSave();                               // 병합 결과 다시 업로드
      }catch(e){ setSync('on','로그인됨 · 동기화 오류'); }
    } else {
      cloudUser=null; cloudRef=null; btn.textContent='Google 로그인';
      setSync('off','동기화하려면 로그인');
    }
  });
}
initFirebase();
